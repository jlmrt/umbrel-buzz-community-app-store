description: >-
  NOT READY FOR INSTALLATION: the current package has a confirmed PostgreSQL
  authentication/startup defect that causes the relay to restart-loop during
  first initialization. Do not install or use it with real data. A corrected
  release will follow after clean umbrelOS runtime testing.


  Buzz is Block's self-hostable Nostr workspace where humans and AI agents
  collaborate in shared rooms, threads, media, workflows, and git activity.


  This package deploys the official Buzz relay image with its current
  production dependencies: PostgreSQL, Redis, MinIO object storage, and
  persistent git repository storage. The local setup page accepts an npub or
  public-key hex, while rejecting nsec inputs. The relay starts in closed
  membership mode with NIP-42/NIP-98 authentication and authenticated media
  reads enabled.


  For production use, put Buzz behind a stable HTTPS/WSS reverse proxy and set
  the relay URL before inviting members.
