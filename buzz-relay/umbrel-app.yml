releaseNotes: >-
  NOT READY FOR INSTALLATION: the startup-chain corrections require a complete clean umbrelOS runtime test before use with real data.
  Uses app-unique dependency addresses, including a valid hyphenated MinIO network alias, percent-encodes arbitrary service passwords in database URLs, and requires an authenticated PostgreSQL readiness query.
  Adds a guided owner and Community URL setup flow with server-derived media and allowed-origin settings.
  Locks the canonical Community URL after initialization because each URL identifies a distinct Buzz community.
  Adds authenticated metadata-only relay health, aggregate usage statistics, storage totals, and a coordinated local backup export.
  Restore remains intentionally unavailable until destructive clean-device recovery testing validates credential migration and rollback.
  Fixes local Community URL discovery when operations metadata was created by the root backup worker, and verifies runtime assets again inside the setup service.
  Allows the official Buzz Desktop webview origins to complete join-policy discovery before the NIP-42 WebSocket flow.
  Uses an Umbrel-authenticated admin surface separated from the relay endpoint, closed relay authentication, authenticated media reads, and disabled external push delivery.
  Tracks official Block Buzz upstream main at commit 1a56b7c.
  Relay image is pinned to ghcr.io/block/buzz:sha-1a56b7c@sha256:c0bc6af1c9b4e67e8f159307f4b7a0acb18dfc0edbace4fce5d0fe2932dafe51.
  Latest upstream release reference: v0.4.26 published 2026-07-25T13:58:37Z.
  Review the generated pull request and upstream deployment-file drift before merging.
