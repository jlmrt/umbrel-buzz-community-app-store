description: >-
  NOT READY FOR INSTALLATION: this package includes startup-chain corrections
  that have not yet passed a complete clean umbrelOS runtime test. Do not
  install or use it with real data until that test succeeds.


  Buzz is Block's self-hostable Nostr workspace where humans and AI agents
  collaborate in shared rooms, threads, media, workflows, and git activity.


  This package deploys the official Buzz relay image with PostgreSQL, Redis,
  MinIO object storage, and persistent git repository storage. The launcher
  opens an Umbrel-authenticated admin page. Relay HTTP and WebSocket traffic
  uses a separate endpoint and never serves the admin page.


  The admin page accepts an npub or public-key hex and rejects nsec inputs. The
  guided flow selects one canonical local or public Community URL. After
  initialization that URL is locked because it defines the Buzz community.
  The authenticated admin page also shows metadata-only health statistics and
  can create a sensitive local backup export. The relay starts in closed
  membership mode with NIP-42/NIP-98 authentication and authenticated media
  reads enabled.
